
    <!-- ********************************************* -->
    <!-- ************* REPRODUCTOR DE MÚSICA ********* -->
    <!-- ********************************************* -->
    <div id="music-player" class="music-player">
      <div class="player-controls">
        <button id="prev-track" class="control-button" aria-label="Canción anterior">
          <i class="fas fa-step-backward"></i>
        </button>
        <button id="play-pause" class="control-button" aria-label="Reproducir/Pausar">
          <i class="fas fa-play"></i>
        </button>
        <button id="next-track" class="control-button" aria-label="Siguiente canción">
          <i class="fas fa-step-forward"></i>
        </button>
      </div>
      <div class="player-info">
        <div id="now-playing" class="now-playing">Selecciona una canción</div>
        <div class="progress-container">
          <div class="progress-bar"></div>
        </div>
      </div>
      <audio id="audio-element"></audio>
    </div>
